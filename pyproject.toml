[project]
name = "autonomous-segmentation"
version = "0.1.0"
description = "Lane, road, and cone semantic segmentation for autonomous racing"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "scipy>=1.12.0",
    "transformers>=4.40.0,<5.0.0",
    "accelerate>=0.26.0",
    "ultralytics>=8.4.46",
    "clip",
    "imageio-ffmpeg>=0.6.0",
]

# Open3D has no cp313 wheels yet; install mesh tooling only when needed:
#   uv sync --extra mesh
# Use Python 3.10–3.12 for the mesh stage (see pipeline_v2/mesh.py).
[project.optional-dependencies]
mesh = [
    "open3d>=0.18.0",
    "trimesh>=4.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["segment_video"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
