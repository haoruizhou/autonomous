[project]
name = "autonomous-segmentation"
version = "0.1.0"
description = "Lane, road, and cone semantic segmentation for autonomous racing"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "scipy>=1.12.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["segment_video"]
